<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Contato</title>
    </head>
    <body>
        <h2>Cadastrar Novo Contato</h2>

        <!-- PASSO 1: ESTRUTURA BASE DO FORMULÁRIO -->
        <form action="/salvar-contato" method="post">

            <!-- PASSO 2: NOME E SOBRENOME -->
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <br>
            <div>
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome" required>
            </div>
            <br>

            <!-- PASSO 3: EMAIL com validação nativa do HTML5 -->
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@dominio.com">
            </div>
            <br>

            <!-- PASSO 4: Telefone com máscara (Regex) via atributo pattern -->
             <div>
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" 
                name="telefone" pattern="\(\d{2}\) \d{5}-\d{4}" 
                placeholder="(XX) XXXXX-XXXX" 
                title="O formato deve ser (XX) XXXXX-XXXX" required>     
             </div>
             <br>

             <!-- PASSO 5: Cidade e Esttado (Listbox) -->
             <div>
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
             </div>
             <br>
            <div>
                <label for="estado">Estado:</label>
                <select id="estado" name="estado" required>
                    <option value="">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="ES">Espírito Santo</option>
                </select>
                <!-- Adicione mais estados conforme necessário -->
            </div>
            <br>

            <!--Passo6: Botão de submissão -->
            <button type="submit">Salvar contato</button>
        </form>

    </body>
</html>
